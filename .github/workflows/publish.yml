name: 📦 Publish Package

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write  # npm Trusted Publishing (OIDC) and provenance

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: ⬆️ Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: 🏷️ Check tag matches package version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm run test

      - name: 🔍 Type check
        run: npm run typecheck

      - name: 🏗️ Build package
        run: npm run build:package

      # No token: npm authenticates this workflow via Trusted Publishing (configured on npmjs.com
      # for common-origin/common-origin-design-system, workflow publish.yml). Provenance is automatic.
      - name: 📢 Publish to npm
        run: npm publish --access public
